<script>
/* Panel de Decorarte: todo pasa por google.script.run hacia Codigo.gs */

var S = {
  datos: null,          // { config, productos, paquetes, correo, urlCatalogo }
  vista: 'productos',   // productos | paquetes | ajustes | producto | paquete
  filtro: 'todos',      // todos | <idCategoria> | ocultos
  busqueda: '',
  form: null,           // copia en edición
  fotoNueva: null,      // { base64, tipo, url } foto reducida elegida en el formulario
  quitarFoto: false,    // se tocó "Quitar la foto"
  cambios: false,       // hay cambios sin guardar en el formulario
};

var $ = function (id) { return document.getElementById(id); };
var vista = $('vista');

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function ico(id) { return '<svg aria-hidden="true"><use href="#i-' + id + '"/></svg>'; }
function normalizar(t) { return String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
function crearId(t) { return normalizar(t).replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, ''); }

function formatearPrecio(n) {
  if (n === null || n === undefined || n === '' || isNaN(Number(n))) return '';
  n = Number(n);
  return '$' + n.toLocaleString('en-US', { minimumFractionDigits: Number.isInteger(n) ? 0 : 2, maximumFractionDigits: 2 });
}
function textoPrecio(item) {
  var p = formatearPrecio(item.precio);
  if (!p || item.tipoPrecio === 'consultar') return 'Pregunta por precio';
  return item.tipoPrecio === 'desde' ? 'Desde ' + p : p;
}

function urlFoto(foto, ancho) {
  foto = String(foto || '').trim();
  if (!foto) return '';
  if (/^(https?:|data:|blob:)/.test(foto)) return foto;
  if (foto.indexOf('/') >= 0 || /\.(svg|png|jpe?g|webp)$/i.test(foto)) return (S.datos ? S.datos.urlCatalogo : PANEL.urlCatalogo) + foto;
  return 'https://lh3.googleusercontent.com/d/' + foto + '=w' + (ancho || 300);
}
function imgFoto(foto, clase, ancho) {
  var src = urlFoto(foto, ancho);
  if (!src) return '<img class="' + clase + ' sin-foto" src="' + esc(PANEL.urlLogo) + '" alt="">';
  return '<img class="' + clase + '" src="' + esc(src) + '" alt="" loading="lazy">';
}
// Si una foto no carga, se ve el logo.
document.addEventListener('error', function (e) {
  var img = e.target;
  if (img.tagName !== 'IMG') return;
  var drive = /lh3\.googleusercontent\.com\/d\/([\w-]+)=w(\d+)/.exec(img.src);
  if (drive && !img.dataset.reintento) {
    img.dataset.reintento = '1';
    img.src = 'https://drive.google.com/thumbnail?id=' + drive[1] + '&sz=w' + drive[2];
    return;
  }
  if (!img.classList.contains('sin-foto')) { img.classList.add('sin-foto'); img.src = PANEL.urlLogo; }
}, true);

/* ---------------- Servidor ---------------- */

function llamar(funcion) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolver, rechazar) {
    var r = google.script.run.withSuccessHandler(resolver).withFailureHandler(function (err) {
      rechazar(new Error(String((err && err.message) || err).replace(/^(Exception|Error):\s*/, '')));
    });
    r[funcion].apply(r, args);
  });
}

function ocupado(texto) {
  $('ocupado-texto').textContent = texto || 'Guardando…';
  $('ocupado').hidden = !texto;
}

var temporizadorAviso;
function avisar(texto, tipo) {
  var a = $('aviso');
  a.className = 'aviso ' + (tipo || 'exito');
  a.innerHTML = (tipo === 'error' ? '' : ico('check')) + '<span>' + esc(texto) + '</span>';
  a.hidden = false;
  clearTimeout(temporizadorAviso);
  temporizadorAviso = setTimeout(function () { a.hidden = true; }, tipo === 'error' ? 6000 : 2600);
}

/** Ejecuta una acción del servidor con pantalla de espera y actualiza los datos. */
async function accion(textoEspera, funcion) {
  var args = Array.prototype.slice.call(arguments, 2);
  ocupado(textoEspera);
  try {
    await esperarRapidas();
    var datos = await llamar.apply(null, [funcion].concat(args));
    S.datos = datos;
    return datos;
  } finally {
    ocupado('');
  }
}

function confirmar(titulo, texto, textoSi) {
  return new Promise(function (resolver) {
    $('confirmar-titulo').textContent = titulo;
    $('confirmar-texto').textContent = texto || '';
    $('confirmar-si').textContent = textoSi || 'Sí, eliminar';
    $('confirmar').hidden = false;
    $('confirmar-si').focus();
    function cerrar(valor) {
      $('confirmar').hidden = true;
      $('confirmar-si').onclick = $('confirmar-no').onclick = null;
      resolver(valor);
    }
    $('confirmar-si').onclick = function () { cerrar(true); };
    $('confirmar-no').onclick = function () { cerrar(false); };
  });
}

/* ---------------- Fotos en segundo plano ----------------
   El producto se guarda al momento; la foto se sube después, una a la vez.
   Mientras sube, la tarjeta dice "Subiendo foto…"; si falla, ofrece "Reintentar".
   Las fotos pendientes se guardan en el teléfono (IndexedDB): si se cierra el panel,
   se reanudan la próxima vez que se abra. */

var almacen = (function () {
  var conexion = null;
  function abrir() {
    if (!conexion) {
      conexion = new Promise(function (resolver, rechazar) {
        if (!window.indexedDB) return rechazar(new Error('sin IndexedDB'));
        var r = indexedDB.open('decorarte-panel', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('fotos', { keyPath: 'productoId' }); };
        r.onsuccess = function () { resolver(r.result); };
        r.onerror = function () { rechazar(r.error); };
      });
    }
    return conexion;
  }
  function operar(modo, fn) {
    return abrir().then(function (db) {
      return new Promise(function (resolver, rechazar) {
        var t = db.transaction('fotos', modo);
        var pedido = fn(t.objectStore('fotos'));
        t.oncomplete = function () { resolver(pedido && pedido.result); };
        t.onerror = function () { rechazar(t.error); };
      });
    });
  }
  return {
    guardar: function (x) { return operar('readwrite', function (s) { return s.put(x); }).catch(function () {}); },
    borrar: function (id) { return operar('readwrite', function (s) { return s.delete(id); }).catch(function () {}); },
    todas: function () { return operar('readonly', function (s) { return s.getAll(); }).catch(function () { return []; }); },
  };
})();

var subidas = {};     // productoId -> { productoId, base64, tipo, nombre, url, estado: 'pendiente'|'subiendo'|'error', siguiente }
var subiendoAhora = false;

function subidaDe(id) {
  var s = subidas[id];
  return s ? (s.siguiente || s) : null;
}
function haySubidasPendientes() {
  return Object.keys(subidas).some(function (id) { return subidas[id].estado !== 'error'; });
}

function base64AUrl(base64, tipo) {
  var binario = atob(base64);
  var bytes = new Uint8Array(binario.length);
  for (var i = 0; i < binario.length; i++) bytes[i] = binario.charCodeAt(i);
  return URL.createObjectURL(new Blob([bytes], { type: tipo }));
}

function encolarFoto(productoId, foto, nombre) {
  var item = { productoId: productoId, base64: foto.base64, tipo: foto.tipo, nombre: nombre, url: foto.url, estado: 'pendiente' };
  var actual = subidas[productoId];
  if (actual && actual.estado === 'subiendo') {
    actual.siguiente = item; // la que ya va subiendo termina; después sube esta (gana la última)
  } else {
    if (actual && actual.url) URL.revokeObjectURL(actual.url);
    subidas[productoId] = item;
  }
  almacen.guardar({ productoId: productoId, base64: foto.base64, tipo: foto.tipo, nombre: nombre, creado: Date.now() });
  procesarSubidas();
}

function cancelarSubida(productoId) {
  var s = subidas[productoId];
  if (!s) return true;
  if (s.estado === 'subiendo') return false;
  if (s.url) URL.revokeObjectURL(s.url);
  delete subidas[productoId];
  almacen.borrar(productoId);
  return true;
}

async function procesarSubidas() {
  if (subiendoAhora) return;
  var id = Object.keys(subidas).filter(function (k) { return subidas[k].estado === 'pendiente'; })[0];
  if (!id) return;
  var item = subidas[id];
  subiendoAhora = true;
  item.estado = 'subiendo';
  mostrarSubidas();
  try {
    var datos = await llamar('panelSubirFotoProducto', item.productoId, item.base64, item.tipo, item.nombre);
    S.datos = datos;
    if (item.siguiente) {
      subidas[id] = item.siguiente;
    } else {
      delete subidas[id];
      almacen.borrar(id);
      if (S.vista !== 'producto') avisar('Foto de "' + item.nombre + '" lista en el catálogo');
    }
  } catch (err) {
    if (item.siguiente) {
      subidas[id] = item.siguiente;
    } else if (/ya no existe/.test(err.message)) {
      delete subidas[id];
      almacen.borrar(id);
    } else {
      item.estado = 'error';
      item.error = err.message;
      avisar('No se pudo subir la foto de "' + item.nombre + '". Revisa tu señal y toca "Reintentar".', 'error');
    }
  } finally {
    subiendoAhora = false;
    mostrarSubidas();
    procesarSubidas();
  }
}

function reintentarSubida(id) {
  var s = subidas[id];
  if (s && s.estado === 'error') { s.estado = 'pendiente'; procesarSubidas(); }
}

/** Actualiza en pantalla el estado de las fotos sin redibujar formularios (no se pierde lo que se escribe). */
function mostrarSubidas() {
  if (S.vista === 'productos' && $('resultados')) renderResultados();
  var estado = $('foto-estado-subida');
  if (estado && S.form) {
    var s = subidaDe(S.form.id);
    estado.hidden = !s;
    if (s) {
      estado.className = 'foto-estado' + (s.estado === 'error' ? ' error' : '');
      estado.innerHTML = s.estado === 'error'
        ? 'No se subió la foto. <button type="button" class="enlace" data-accion="reintentar-foto" data-id="' + esc(S.form.id) + '">Reintentar</button>'
        : '<span class="girador-chico"></span> Subiendo foto…';
    }
  }
}

function estadoSubidaHtml(id) {
  var s = subidaDe(id);
  if (!s) return '';
  if (s.estado === 'error') {
    return '<div class="item-subida error" role="status">No se subió la foto.' +
      '<button type="button" data-accion="reintentar-foto" data-id="' + esc(id) + '">Reintentar</button></div>';
  }
  return '<div class="item-subida" role="status"><span class="girador-chico"></span>' +
    (s.estado === 'subiendo' ? 'Subiendo foto…' : 'Foto en espera…') + '</div>';
}

/** Al abrir el panel: reanuda las fotos que quedaron pendientes en el teléfono. */
async function reanudarSubidas() {
  var guardadas = await almacen.todas();
  (guardadas || []).forEach(function (g) {
    var existe = S.datos.productos.some(function (p) { return p.id === g.productoId; });
    if (!existe) { almacen.borrar(g.productoId); return; }
    if (subidas[g.productoId]) return;
    subidas[g.productoId] = { productoId: g.productoId, base64: g.base64, tipo: g.tipo, nombre: g.nombre, url: base64AUrl(g.base64, g.tipo), estado: 'pendiente' };
  });
  mostrarSubidas();
  procesarSubidas();
}

window.addEventListener('online', function () {
  Object.keys(subidas).forEach(reintentarSubida);
});

/* ---------------- Acciones rápidas sin espera ----------------
   Destacar, ocultar y mover se ven al momento, sin bloquear la pantalla. Reglas de seguridad:
   - Lo que se ve = último estado CONFIRMADO por el servidor + cambios pendientes (marcados "Guardando…").
   - Las acciones van al servidor de una en una y en el orden en que se tocaron.
   - Si una falla, se descartan las pendientes de ese mismo producto (se pensaron sobre un estado que
     no se guardó), la tarjeta vuelve a su estado real y se avisa con claridad.
   - Una respuesta vieja del servidor nunca reemplaza a una más nueva (se comparan por versión).
   - Las acciones con espera (guardar formulario, eliminar, ajustes) esperan a que terminen las rápidas. */

var confirmado = null;   // último estado que dio el servidor
var pendientes = [];     // acciones rápidas aún no confirmadas (la primera es la que va en camino)
var vistaCalculada = null;
var vistaVieja = true;

delete S.datos;
Object.defineProperty(S, 'datos', {
  configurable: true,
  get: function () {
    if (vistaVieja) {
      if (!confirmado) { vistaCalculada = null; } else {
        vistaCalculada = JSON.parse(JSON.stringify(confirmado));
        pendientes.forEach(function (op) { op.aplicar(vistaCalculada); });
      }
      vistaVieja = false;
    }
    return vistaCalculada;
  },
  set: function (nuevo) {
    // Una respuesta que llega tarde (de antes de otro cambio ya confirmado) no se usa.
    if (nuevo && confirmado && nuevo.version != null && confirmado.version != null && nuevo.version < confirmado.version) return;
    confirmado = nuevo;
    vistaVieja = true;
  },
});

var procesandoRapida = false;
var esperandoRapidas = [];

function claveDe(op) { return op.tipo + ':' + op.id; }
function estaGuardando(tipo, id) {
  return pendientes.some(function (op) { return op.tipo === tipo && op.id === id; });
}
function hayRapidasPendientes() { return pendientes.length > 0; }

/** Espera a que se confirmen todas las acciones rápidas (para que el orden en el servidor sea el mismo). */
function esperarRapidas() {
  if (!pendientes.length) return Promise.resolve();
  return new Promise(function (resolver) { esperandoRapidas.push(resolver); });
}

function accionRapida(op) {
  pendientes.push(op);
  vistaVieja = true;
  refrescarListas();
  procesarRapidas();
}

async function procesarRapidas() {
  if (procesandoRapida) return;
  var op = pendientes[0];
  if (!op) {
    var avisados = esperandoRapidas; esperandoRapidas = [];
    avisados.forEach(function (r) { r(); });
    return;
  }
  procesandoRapida = true;
  try {
    var datos = await llamar.apply(null, [op.funcion].concat(op.args));
    pendientes.shift();
    S.datos = datos;
  } catch (err) {
    pendientes.shift();
    var clave = claveDe(op);
    pendientes = pendientes.filter(function (x) { return claveDe(x) !== clave; });
    vistaVieja = true;
    avisar('No se guardó: ' + op.descripcion + '. ' + err.message + ' La tarjeta volvió a como estaba; inténtalo de nuevo.', 'error');
  } finally {
    procesandoRapida = false;
    vistaVieja = true;
    refrescarListas();
    procesarRapidas();
  }
}

/** Vuelve a dibujar solo las listas (nunca un formulario abierto, para no borrar lo que se escribe). */
function refrescarListas() {
  if (S.vista === 'productos' && $('resultados')) renderResultados();
  else if (S.vista === 'paquetes') renderPaquetes();
}

function ordenarComoServidor(a, b) {
  var oa = a.orden == null ? Infinity : a.orden;
  var ob = b.orden == null ? Infinity : b.orden;
  return oa - ob || a.nombre.localeCompare(b.nombre, 'es');
}

/** Igual que reordenar_ en Codigo.gs: mueve un lugar dentro de su grupo y renumera 1..n. */
function moverEnLista(lista, id, mismoGrupo, direccion) {
  var item = lista.filter(function (x) { return x.id === id; })[0];
  if (!item) return;
  var grupo = lista.filter(function (x) { return mismoGrupo(x, item); }).sort(ordenarComoServidor);
  var desde = grupo.indexOf(item);
  var hasta = Math.max(0, Math.min(grupo.length - 1, desde + (direccion < 0 ? -1 : 1)));
  grupo.splice(desde, 1);
  grupo.splice(hasta, 0, item);
  grupo.forEach(function (x, i) { x.orden = i + 1; });
  lista.sort(ordenarComoServidor);
}

function rapidaProducto(id, campo, valor, descripcion) {
  accionRapida({
    tipo: 'p', id: id, funcion: 'panelCambiarProducto', args: [id, campo, valor], descripcion: descripcion,
    aplicar: function (d) { d.productos.forEach(function (x) { if (x.id === id) x[campo] = valor; }); },
  });
}
function rapidaMoverProducto(id, direccion, descripcion) {
  accionRapida({
    tipo: 'p', id: id, funcion: 'panelMoverProducto', args: [id, direccion], descripcion: descripcion,
    aplicar: function (d) { moverEnLista(d.productos, id, function (x, y) { return x.categoria === y.categoria; }, direccion); },
  });
}
function rapidaPaquete(id, valor, descripcion) {
  accionRapida({
    tipo: 'k', id: id, funcion: 'panelCambiarPaquete', args: [id, 'disponible', valor], descripcion: descripcion,
    aplicar: function (d) { d.paquetes.forEach(function (x) { if (x.id === id) x.disponible = valor; }); },
  });
}
function rapidaMoverPaquete(id, direccion, descripcion) {
  accionRapida({
    tipo: 'k', id: id, funcion: 'panelMoverPaquete', args: [id, direccion], descripcion: descripcion,
    aplicar: function (d) { moverEnLista(d.paquetes, id, function (x, y) { return x.servicioId === y.servicioId; }, direccion); },
  });
}

function guardandoHtml(tipo, id) {
  return estaGuardando(tipo, id)
    ? '<div class="item-guardando" role="status"><span class="girador-chico"></span>Guardando…</div>'
    : '';
}

/* ---------------- Navegación ---------------- */

function categoria(id) { return S.datos.config.categorias.filter(function (c) { return c.id === id; })[0]; }
function esServicio(p) { var c = categoria(p.categoria); return !!c && c.tipo === 'servicios'; }
function servicios() { return S.datos.productos.filter(esServicio); }

async function ir(destino) {
  if (S.cambios && !(await confirmar('¿Salir sin guardar?', 'Los cambios que hiciste se perderán.', 'Sí, salir'))) return;
  S.cambios = false;
  S.form = null;
  S.fotoNueva = null;
  S.quitarFoto = false;
  S.vista = destino;
  var seccion = destino === 'producto' ? 'productos' : destino === 'paquete' ? 'paquetes' : destino;
  Array.prototype.forEach.call(document.querySelectorAll('[data-ir]'), function (b) {
    if (b.dataset.ir === seccion) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  render();
  window.scrollTo(0, 0);
}

function render() {
  if (!S.datos) return;
  $('nav-agregar').hidden = S.vista === 'producto' || S.vista === 'paquete';
  if (S.vista === 'productos') renderProductos();
  else if (S.vista === 'paquetes') renderPaquetes();
  else if (S.vista === 'ajustes') renderAjustes();
  else if (S.vista === 'producto') renderFormProducto();
  else if (S.vista === 'paquete') renderFormPaquete();
}

/* ---------------- Productos ---------------- */

function renderProductos() {
  var d = S.datos;
  var filtros = [{ id: 'todos', nombre: 'Todos', n: d.productos.length }]
    .concat(d.config.categorias.map(function (c) {
      return { id: c.id, nombre: c.nombre, n: d.productos.filter(function (p) { return p.categoria === c.id; }).length };
    }))
    .concat([{ id: 'ocultos', nombre: 'Ocultos', n: d.productos.filter(function (p) { return !p.disponible; }).length }]);

  var html = '<h1>Tus productos</h1>' +
    '<label class="buscador">' + ico('buscar') +
    '<input id="buscar" type="search" placeholder="Buscar por nombre…" value="' + esc(S.busqueda) + '" autocomplete="off" aria-label="Buscar productos"></label>' +
    '<div class="filtros">' + filtros.map(function (f) {
      return '<button type="button" class="filtro" data-filtro="' + esc(f.id) + '" aria-pressed="' + (S.filtro === f.id) + '">' +
        esc(f.nombre) + ' <span class="num">' + f.n + '</span></button>';
    }).join('') + '</div><div id="resultados"></div>';
  vista.innerHTML = html;
  renderResultados();
}

/** Solo la lista: así el buscador no se redibuja mientras se escribe (en el celular se cerraría el teclado). */
function renderResultados() {
  var d = S.datos;
  var q = normalizar(S.busqueda).split(/\s+/).filter(Boolean);
  var nombreOcasion = {};
  d.config.ocasiones.forEach(function (o) { nombreOcasion[o.id] = o.nombre; });
  var lista = d.productos.filter(function (p) {
    if (S.filtro === 'ocultos' && p.disponible) return false;
    if (S.filtro !== 'todos' && S.filtro !== 'ocultos' && p.categoria !== S.filtro) return false;
    if (!q.length) return true;
    var texto = normalizar([p.nombre, p.descripcion].concat(p.ocasiones.map(function (o) { return nombreOcasion[o]; })).join(' '));
    return q.every(function (w) { return texto.indexOf(w) >= 0; });
  });

  var html = '';
  if (!d.productos.length) {
    html += '<div class="vacio"><strong>Aún no hay productos</strong>Toca <b>Agregar</b> para subir el primero.</div>';
  } else if (!lista.length) {
    html += '<div class="vacio"><strong>No hay resultados</strong>Prueba con otra palabra o filtro.</div>';
  } else {
    // Agrupados por categoría porque el orden se maneja dentro de cada una.
    d.config.categorias.concat([{ id: '', nombre: 'Sin categoría' }]).forEach(function (cat) {
      var deCat = lista.filter(function (p) { return cat.id ? p.categoria === cat.id : !categoria(p.categoria); });
      if (!deCat.length) return;
      var todosCat = d.productos.filter(function (p) { return p.categoria === cat.id; });
      html += '<h2 class="grupo-titulo">' + esc(cat.nombre) + '<small>' + deCat.length + '</small></h2><div class="lista">' +
        deCat.map(function (p) { return tarjetaProducto(p, todosCat); }).join('') + '</div>';
    });
  }
  $('resultados').innerHTML = html;
}

function tarjetaProducto(p, grupo) {
  var i = grupo.indexOf(p);
  var precio = textoPrecio(p);
  var ocasiones = S.datos.config.ocasiones.filter(function (o) { return p.ocasiones.indexOf(o.id) >= 0; });
  return '<article class="item' + (p.disponible ? '' : ' oculto') + '">' +
    '<button type="button" class="item-principal" data-accion="editar-producto" data-id="' + esc(p.id) + '" aria-label="Editar ' + esc(p.nombre) + '">' +

function interruptor(campo, titulo, texto, valor) {
  return '<label class="interruptor"><span class="interruptor-texto"><strong>' + esc(titulo) + '</strong><small>' + esc(texto) + '</small></span>' +
    '<input type="checkbox" data-campo="' + campo + '"' + (valor ? ' checked' : '') + '><span class="palanca"></span></label>';
}

function leerPrecio(valor) {
  var limpio = String(valor || '').replace(/[$,\s]/g, '');
  if (!limpio) return null;
  var n = Number(limpio);
  return isFinite(n) ? n : NaN;
}

async function guardarProducto() {
  var f = S.form;
  f.nombre = f.nombre.trim();
  if (!f.nombre) { avisar('Escribe el nombre del producto.', 'error'); $('f-nombre').classList.add('error'); $('f-nombre').focus(); return; }
  if (f.tipoPrecio !== 'consultar' && !(f.precio >= 0 && f.precio !== null)) {
    avisar('Escribe el precio, o elige "Pregunta por precio".', 'error');
    var campo = $('f-precio'); if (campo) { campo.classList.add('error'); campo.focus(); }
    return;
  }
  try {
    var envio = Object.assign({}, f, { posicion: f.posicion !== S.posicionOriginal ? f.posicion : null });
    // La foto no viaja aquí: solo se avisa si se quitó. La nueva se sube en segundo plano.
    if (S.quitarFoto && !S.fotoNueva) { envio.cambiarFoto = true; envio.foto = ''; }
    var datos = await accion('Guardando…', 'panelGuardarProducto', envio);
    var foto = S.fotoNueva;
    S.fotoNueva = null;
    if (foto) encolarFoto(datos.guardadoId, foto, f.nombre);
    S.cambios = false;
    var nuevo = !f.id;
    await ir('productos');
    avisar((nuevo ? '¡Producto agregado al catálogo!' : 'Cambios guardados') + (foto ? ' Subiendo la foto…' : ''));
  } catch (err) {
    ocupado('');
    avisar(err.message, 'error');
  }
}

async function eliminarProducto() {
  var f = S.form;
  var paquetes = S.datos.paquetes.filter(function (k) { return k.servicioId === f.id; }).length;
  var ok = await confirmar('¿Eliminar "' + f.nombre + '"?',
    'Se borrará del catálogo' + (paquetes ? ' junto con sus ' + paquetes + ' paquetes' : '') + '. Si solo quieres quitarlo un tiempo, mejor ocúltalo.');
  if (!ok) return;
  try {
    cancelarSubida(f.id);
    await accion('Eliminando…', 'panelEliminarProducto', f.id);
    S.cambios = false;
    await ir('productos');
    avisar('Producto eliminado');
  } catch (err) { avisar(err.message, 'error'); }
}

/* ---------------- Fotos ---------------- */

async function fotoElegida(archivo) {
  if (!archivo) return;
  ocupado('Preparando foto…');
  try {
    var r = await reducirImagen(archivo);
    if (S.fotoNueva && S.fotoNueva.url) URL.revokeObjectURL(S.fotoNueva.url);
    S.fotoNueva = { base64: r.base64, tipo: r.tipo, ancho: r.ancho, alto: r.alto, bytes: r.bytes, url: URL.createObjectURL(r.blob) };
    S.quitarFoto = false;
    S.cambios = true;
    render();
  } catch (err) {
    avisar(err.message || 'No se pudo usar esa foto.', 'error');
  } finally {
    ocupado('');
  }
}
['foto-camara', 'foto-galeria'].forEach(function (id) {
  $(id).addEventListener('change', function (e) { fotoElegida(e.target.files[0]); e.target.value = ''; });
});

      texto('mapsUrl', 'Enlace de Google Maps <span class="nota">(opcional)</span>', c.mapsUrl, 'type="url" inputmode="url" placeholder="https://maps.app.goo.gl/…"') +
      texto('horario', 'Horario <span class="nota">(opcional)</span>', c.horario, 'placeholder="Lunes a sábado de 10:00 a 20:00"') +
      texto('lema', 'Frase bajo el logo', c.lema) +
      '<button type="button" class="boton boton-principal" data-accion="guardar-contacto">' + ico('check') + 'Guardar contacto</button>' +
    '</div>' +

    '<h2>Temporada destacada</h2><div class="tarjeta-form">' +
      '<p class="ayuda" style="margin-top:0">Los productos <b>destacados</b> de esta ocasión salen hasta arriba del catálogo.</p>' +
      '<div class="campo"><label for="a-temporada">Ocasión de temporada</label><select class="entrada" id="a-temporada" data-ajuste="temporada">' +
        '<option value="">Ninguna (no mostrar sección)</option>' +
        c.ocasiones.map(function (o) { return '<option value="' + esc(o.id) + '"' + (o.id === c.temporada ? ' selected' : '') + '>' + esc((o.emoji ? o.emoji + ' ' : '') + o.nombre) + '</option>'; }).join('') +
      '</select></div>' +
      texto('temporadaTitulo', 'Título de la sección <span class="nota">(opcional)</span>', c.temporadaTitulo, 'placeholder="Ej. Especial 10 de mayo"') +
      '<button type="button" class="boton boton-principal" data-accion="guardar-temporada">' + ico('check') + 'Guardar temporada</button>' +
    '</div>' +

    '<h2>Ocasiones</h2><div class="tarjeta-form">' +
      '<p class="ayuda" style="margin-top:0">Son los botones para filtrar el catálogo. El emoji es opcional.</p>' +
      A.ocasiones.map(function (o, i) {
        return '<div class="fila-editable">' +
          '<input class="entrada emoji" data-lista="ocasiones" data-i="' + i + '" data-prop="emoji" value="' + esc(o.emoji) + '" aria-label="Emoji" maxlength="4">' +
          '<input class="entrada" data-lista="ocasiones" data-i="' + i + '" data-prop="nombre" value="' + esc(o.nombre) + '" aria-label="Nombre de la ocasión" placeholder="Nombre">' +
          '<button type="button" class="boton-icono" data-accion="mover-fila" data-lista="ocasiones" data-i="' + i + '" aria-label="Subir"' + (i === 0 ? ' disabled' : '') + '>' + ico('arriba') + '</button>' +
          '<button type="button" class="boton-icono peligro" data-accion="quitar-fila" data-lista="ocasiones" data-i="' + i + '" aria-label="Quitar">' + ico('basura') + '</button></div>' +
          (productosDeOcasion(o.id || crearId(o.nombre)) ? '' :
            '<p class="nota-fila">Aún sin productos: aparecerá en el catálogo cuando tenga al menos uno visible.</p>');
      }).join('') +
      '<button type="button" class="agregar-fila" data-accion="agregar-fila" data-lista="ocasiones">+ Agregar ocasión</button>' +
      '<div style="height:14px"></div><button type="button" class="boton boton-principal" data-accion="guardar-listas">' + ico('check') + 'Guardar ocasiones</button>' +
    '</div>' +

    '<h2>Categorías</h2><div class="tarjeta-form">' +
      '<p class="ayuda" style="margin-top:0">Son las pestañas de arriba del catálogo. En las de tipo <b>Servicios</b> se muestran los paquetes y el botón "Cotizar".</p>' +
      A.categorias.map(function (o, i) {
        return '<div class="fila-editable">' +
          '<input class="entrada" data-lista="categorias" data-i="' + i + '" data-prop="nombre" value="' + esc(o.nombre) + '" aria-label="Nombre de la categoría" placeholder="Nombre">' +
          '<select class="entrada" data-lista="categorias" data-i="' + i + '" data-prop="tipo" aria-label="Tipo">' +
            '<option value="productos"' + (o.tipo !== 'servicios' ? ' selected' : '') + '>Productos</option>' +
            '<option value="servicios"' + (o.tipo === 'servicios' ? ' selected' : '') + '>Servicios</option></select>' +
          '<button type="button" class="boton-icono peligro" data-accion="quitar-fila" data-lista="categorias" data-i="' + i + '" aria-label="Quitar">' + ico('basura') + '</button></div>';
      }).join('') +
      '<button type="button" class="agregar-fila" data-accion="agregar-fila" data-lista="categorias">+ Agregar categoría</button>' +
      '<div style="height:14px"></div><button type="button" class="boton boton-principal" data-accion="guardar-listas">' + ico('check') + 'Guardar categorías</button>' +
    '</div>' +

    '<h2>Personas con acceso al panel</h2><div class="tarjeta-form">' +
      '<p class="ayuda" style="margin-top:0">Correos de Gmail que pueden entrar aquí. Tu correo siempre se queda.</p>' +
      A.autorizados.map(function (correo, i) {
        return '<div class="fila-editable"><input class="entrada" type="email" inputmode="email" data-lista="autorizados" data-i="' + i + '" value="' + esc(correo) + '" aria-label="Correo" placeholder="correo@gmail.com">' +
          '<button type="button" class="boton-icono peligro" data-accion="quitar-fila" data-lista="autorizados" data-i="' + i + '" aria-label="Quitar"' + (correo === S.datos.correo ? ' disabled' : '') + '>' + ico('basura') + '</button></div>';
      }).join('') +
      '<button type="button" class="agregar-fila" data-accion="agregar-fila" data-lista="autorizados">+ Agregar persona</button>' +
      '<div style="height:14px"></div><button type="button" class="boton boton-principal" data-accion="guardar-listas">' + ico('check') + 'Guardar personas</button>' +
    '</div>' +

    '<h2>Tener el panel en tu celular</h2><div class="tarjeta-form">' +
      '<ol class="pasos"><li>Abre <a href="' + esc(S.datos.urlCatalogo) + 'panel/" target="_blank" rel="noopener"><b>este enlace</b></a> en Chrome (Android) o Safari (iPhone).</li>' +
      '<li>Android: menú <b>⋮</b> → <b>Agregar a la pantalla principal</b>. iPhone: botón <b>Compartir</b> → <b>Agregar a inicio</b>.</li>' +
      '<li>Te queda un ícono con tu logo que abre este panel.</li></ol>' +
    '</div>';
}

/** Productos visibles con esa ocasión (el catálogo no muestra ocasiones sin productos). */
function productosDeOcasion(id) {
  return S.datos.productos.filter(function (p) { return p.disponible && p.ocasiones.indexOf(id) >= 0; }).length;
}

function leerAjustesContacto() {
  var r = {};
  Array.prototype.forEach.call(vista.querySelectorAll('[data-ajuste]'), function (el) { r[el.dataset.ajuste] = el.value.trim(); });
  return r;
}

async function guardarAjustes(datos, mensaje) {
  try {
    await accion('Guardando…', 'panelGuardarConfig', datos);
    S.ajustes = null;
    render();
    avisar(mensaje || 'Ajustes guardados');
  } catch (err) { avisar(err.message, 'error'); }
}

/* ---------------- Eventos ---------------- */

document.addEventListener('click', async function (e) {
  var nav = e.target.closest('[data-ir]');
  if (nav) { S.ajustes = null; return ir(nav.dataset.ir); }

  var filtro = e.target.closest('[data-filtro]');
  if (filtro) { S.filtro = filtro.dataset.filtro; return render(); }

  if (S.form) {
    var cat = e.target.closest('[data-categoria]');
    if (cat) {
      S.form.categoria = cat.dataset.categoria;
      S.form.posicion = S.datos.productos.filter(function (x) { return x.categoria === S.form.categoria && x.id !== S.form.id; }).length + 1;
      S.posicionOriginal = -1;
      S.cambios = true;
      return render();
    }
    var oc = e.target.closest('[data-ocasion]');
    if (oc) {
      var lista = S.form.ocasiones, id = oc.dataset.ocasion, i = lista.indexOf(id);
      if (i >= 0) lista.splice(i, 1); else lista.push(id);
      oc.setAttribute('aria-pressed', String(i < 0));
      S.cambios = true;
      return;
    }
    var tp = e.target.closest('[data-tipo-precio]');
    if (tp) {
      S.form.tipoPrecio = tp.dataset.tipoPrecio;
      S.cambios = true;
      render();
      if (S.form.tipoPrecio !== 'consultar' && S.form.precio == null) $('f-precio').focus();
      return;
    }
  }

  var b = e.target.closest('[data-accion]');
  if (!b || b.disabled) return;
  var id = b.dataset.id;
  var p = id && S.datos.productos.filter(function (x) { return x.id === id; })[0];
  var k = id && S.datos.paquetes.filter(function (x) { return x.id === id; })[0];
  try {
    switch (b.dataset.accion) {
      case 'nuevo-producto': return abrirProducto(null);
      case 'editar-producto': return abrirProducto(id);
      case 'volver': return ir(S.vista === 'paquete' ? 'paquetes' : 'productos');
      case 'guardar-producto': return guardarProducto();
      case 'eliminar-producto': return eliminarProducto();
      case 'foto-camara': return $('foto-camara').click();
      case 'foto-galeria': return $('foto-galeria').click();
      case 'foto-quitar':
        if (S.form.id && !cancelarSubida(S.form.id)) { avisar('Espera a que termine de subir la foto y vuelve a intentarlo.', 'error'); return; }
        S.fotoNueva = null; S.quitarFoto = true; S.cambios = true; return render();
      case 'reintentar-foto': return reintentarSubida(id);
      case 'destacar':
        return rapidaProducto(id, 'destacado', !p.destacado, (p.destacado ? 'quitar la estrella a «' : 'destacar «') + p.nombre + '»');
      case 'ocultar':
        return rapidaProducto(id, 'disponible', !p.disponible, (p.disponible ? 'ocultar «' : 'mostrar «') + p.nombre + '»');
      case 'subir': case 'bajar':
        return rapidaMoverProducto(id, b.dataset.accion === 'subir' ? -1 : 1, 'mover «' + p.nombre + '»');
      case 'nuevo-paquete': return abrirPaquete(null, b.dataset.servicio);
      case 'editar-paquete': return abrirPaquete(id);
      case 'guardar-paquete': return guardarPaquete();
      case 'eliminar-paquete': return eliminarPaquete();
      case 'ocultar-paquete':
        return rapidaPaquete(id, !k.disponible, (k.disponible ? 'ocultar el paquete «' : 'mostrar el paquete «') + k.nombre + '»');
      case 'subir-paquete': case 'bajar-paquete':
        return rapidaMoverPaquete(id, b.dataset.accion === 'subir-paquete' ? -1 : 1, 'mover el paquete «' + k.nombre + '»');
      case 'agregar-nav':
        if (S.vista === 'paquetes') {
          if (!servicios().length) return avisar('Primero agrega un servicio en Productos, con la categoría de servicios.', 'error');
          return abrirPaquete(null);
        }
        if (S.vista !== 'productos') await ir('productos');
        return abrirProducto(null);
      case 'guardar-contacto': {
        var c = leerAjustesContacto();
        return guardarAjustes({
          whatsapp: c.whatsapp, whatsappServicios: c.whatsappServicios, instagram: c.instagram, facebook: c.facebook,
          resenas: c.resenas, direccion: c.direccion, mapsUrl: c.mapsUrl, horario: c.horario, lema: c.lema,
        }, 'Contacto guardado');
      }
      case 'guardar-temporada': {
        var t = leerAjustesContacto();
        return guardarAjustes({ temporada: t.temporada, temporadaTitulo: t.temporadaTitulo }, 'Temporada guardada');
      }
      case 'agregar-fila': {
        var nombre = b.dataset.lista;
        S.ajustes[nombre].push(nombre === 'autorizados' ? '' : nombre === 'categorias' ? { id: '', nombre: '', tipo: 'productos' } : { id: '', emoji: '', nombre: '' });
        render();
        var campos = vista.querySelectorAll('[data-lista="' + nombre + '"][data-i="' + (S.ajustes[nombre].length - 1) + '"]');
        var ultimo = Array.prototype.filter.call(campos, function (el) { return el.tagName === 'INPUT' && el.dataset.prop !== 'emoji'; })[0];
        if (ultimo) ultimo.focus();
        return;
      }
      case 'quitar-fila': {
        var l = S.ajustes[b.dataset.lista], idx = Number(b.dataset.i);
        if (b.dataset.lista === 'categorias') {
          var usados = S.datos.productos.filter(function (x) { return x.categoria === l[idx].id; }).length;
          if (usados && !(await confirmar('¿Quitar la categoría "' + l[idx].nombre + '"?', 'Tiene ' + usados + ' productos; dejarán de verse en el catálogo hasta que les pongas otra categoría.', 'Sí, quitar'))) return;
        }
        l.splice(idx, 1);
        return render();
      }
      case 'mover-fila': {
        var lm = S.ajustes[b.dataset.lista], im = Number(b.dataset.i);
        lm.splice(im - 1, 0, lm.splice(im, 1)[0]);
        return render();
      }
      case 'guardar-listas': {
        var A = S.ajustes;
        var nombres = A.categorias.map(function (x) { return x.nombre.trim(); });
        if (nombres.some(function (n) { return !n; })) { avisar('Escribe el nombre de cada categoría o quita las vacías.', 'error'); return; }
        return guardarAjustes({
          ocasiones: A.ocasiones.filter(function (o) { return o.nombre.trim(); }).map(function (o) { return { id: o.id || crearId(o.nombre), emoji: o.emoji, nombre: o.nombre.trim() }; }),
          categorias: A.categorias.map(function (o) { return { id: o.id || crearId(o.nombre), nombre: o.nombre.trim(), tipo: o.tipo }; }),
          autorizados: A.autorizados.filter(function (x) { return x.trim(); }),
        }, 'Listo, guardado');
      }
    }
  } catch (err) {
    avisar(err.message, 'error');
  }
});

document.addEventListener('input', function (e) {
  var el = e.target;
  if (el.id === 'buscar') { S.busqueda = el.value; renderResultados(); return; }
  if (el.dataset.lista && S.ajustes) {
    var lista = S.ajustes[el.dataset.lista];
    if (el.dataset.prop) lista[Number(el.dataset.i)][el.dataset.prop] = el.value; else lista[Number(el.dataset.i)] = el.value;
    return;
  }
  if (!S.form || !el.dataset.campo) return;
  var campo = el.dataset.campo;
  el.classList.remove('error');
  S.cambios = true;
  if (campo === 'precio') {
    S.form.precio = leerPrecio(el.value);
    $('previa-precio').textContent = isNaN(S.form.precio) ? '—' : textoPrecio(S.form);
  } else if (campo === 'incluye') {
    S.form.incluye = el.value.split('\n');
  } else if (el.type === 'checkbox') {
    S.form[campo] = el.checked;
  } else if (campo === 'posicion') {
    S.form.posicion = Number(el.value);
  } else {
    S.form[campo] = el.value;
    if (campo === 'descripcion') $('contador').textContent = el.value.length + ' / 300';
  }
});
document.addEventListener('change', function (e) {
  var el = e.target;
  if (el.dataset.lista && S.ajustes && el.tagName === 'SELECT') S.ajustes[el.dataset.lista][Number(el.dataset.i)][el.dataset.prop] = el.value;
  if (S.form && el.dataset.campo === 'posicion') { S.form.posicion = Number(el.value); S.cambios = true; }
  if (S.form && el.dataset.campo === 'servicioId') { S.form.servicioId = el.value; S.cambios = true; }
  if (S.form && el.type === 'checkbox' && el.dataset.campo) { S.form[el.dataset.campo] = el.checked; S.cambios = true; }
});

window.addEventListener('beforeunload', function (e) {
  if (S.cambios || haySubidasPendientes() || hayRapidasPendientes()) { e.preventDefault(); e.returnValue = ''; }
});

/* ---------------- Teclado ----------------
   Mientras se escribe en un campo, el teclado ocupa media pantalla: se esconde la barra de abajo
   y "Guardar" deja de flotar, para que se vea lo que se escribe. Al cerrar el teclado, todo vuelve. */
function esCampoDeTexto(el) {
  return el && (el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' ||
    (el.tagName === 'INPUT' && ['checkbox', 'radio', 'file', 'button'].indexOf(el.type) < 0));
}
document.addEventListener('focusin', function (e) {
  if (esCampoDeTexto(e.target)) document.body.classList.add('escribiendo');
});
document.addEventListener('focusout', function () {
  // Al pasar de un campo a otro no se muestra la barra un instante.
  setTimeout(function () {
    if (!esCampoDeTexto(document.activeElement)) document.body.classList.remove('escribiendo');
  }, 80);
});

/* ---------------- Inicio ---------------- */

(async function iniciar() {
  try {
    S.datos = await llamar('panelCargar');
    render();
    reanudarSubidas();
  } catch (err) {
    vista.innerHTML = '<div class="vacio"><strong>No se pudo cargar el panel</strong>' + esc(err.message) +
      '<div style="height:14px"></div><button type="button" class="boton boton-principal" onclick="location.reload()">Intentar de nuevo</button></div>';
  }
})();
</script>
